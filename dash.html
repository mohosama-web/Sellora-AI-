<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم - Sellora AI</title>
<script>const API_BASE='https://sellora-ai-api.mohosamazx3.workers.dev';const SITE_URL='https://sellora-ai-8i7.pages.dev';</script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0f1226;color:#fff;font-family:system-ui,sans-serif;padding:16px}header{display:flex;justify-content:space-between;align-items:center;padding:10px 0}header b{font-size:18px}header b span{color:#a78bfa}.card{background:#1a1f3a;border:1px solid #2a2f55;border-radius:16px;padding:16px;margin-top:12px;text-align:center}.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#333;margin:10px auto;display:block}.input{width:100%;background:#0f1226;border:1px solid #333;color:#fff;padding:11px;border-radius:10px;margin:8px 0;font-size:14px}label{display:block;text-align:right;font-size:13px;font-weight:700}.bigBtn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;font-size:15px;margin-top:10px;cursor:pointer}.backBtn{background:#333!important;color:#fff!important;border:none!important;padding:10px 16px;border-radius:10px;margin-bottom:10px;cursor:pointer}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2a2f55;font-size:14px}.stat:last-child{border:none}.stat b{color:#a5b4fc}</style>
</head>
<body>
<header><b>Sellora <span>AI</span></b><button onclick="location.href=SITE_URL+'/'" style="background:#333;color:#fff;border:none;padding:8px 14px;border-radius:20px">🏠 الرئيسية</button></header>
<button class="backBtn" onclick="location.href=SITE_URL+'/'">← رجوع</button>
<div class="card"><h2>👤 حسابي</h2><img id="accAvatar" class="avatar" src=""><label>اسمك</label><input id="accName" class="input"><label>البريد الإلكتروني</label><input id="accEmail" class="input" readonly style="color:#94a3b8"><label>صورة الملف الشخصي</label><input type="file" id="accPic" accept="image/*" class="input"><button class="bigBtn" style="background:#22c55e;color:#fff" onclick="saveProfile()">حفظ التعديل ✅</button></div>
<div class="card" style="text-align:right"><h3 style="text-align:center">📊 إحصائياتك</h3><div class="stat"><span>📝 إجمالي إعلاناتك</span><b id="statAds">0</b></div><div class="stat"><span>🖼️ رصيد الصور</span><b id="statImages">0</b></div><div class="stat"><span>🔢 المتبقي اليوم</span><b id="statQuota">10</b></div><div class="stat"><span>📅 تاريخ التسجيل</span><b id="statDate">-</b></div></div>
<div class="card"><button class="bigBtn" style="background:#7c3aed;color:#fff" onclick="location.href=SITE_URL+'/?create=1'">➕ إنشاء إعلان جديد</button><button class="bigBtn" style="background:#7c3aed;color:#fff" onclick="goMyAds()">📋 إعلاناتي السابقة</button><button class="bigBtn" style="background:#ef4444;color:#fff" onclick="logout()">🚪 تسجيل الخروج</button></div>
<script>
function getUserId(){const t=localStorage.getItem('sellora_token')||'';if(!t)return'guest';try{return JSON.parse(atob(t.split('.')[1])).email||'guest'}catch(e){return'guest'}}function saveToDevice(k,v){try{localStorage.setItem(`sellora_${getUserId()}_${k}`,typeof v==='string'?v:JSON.stringify(v))}catch(e){}}function getFromDevice(k,d){try{const v=localStorage.getItem(`sellora_${getUserId()}_${k}`);if(v==null)return d;try{return JSON.parse(v)}catch(e){return v}}catch(e){return d}}
let token=localStorage.getItem('sellora_token')||'';let user=null;
async function init(){if(!token){location.href=SITE_URL+'/?login=1';return}try{const r=await fetch(API_BASE+'/api/me',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(d.user)user=d.user;else{const login=getFromDevice('login',null);if(login)user={email:login.email,name:login.name,pic:login.pic}} }catch(e){const login=getFromDevice('login',null);if(login)user={email:login.email,name:login.name,pic:login.pic}} if(!user){location.href=SITE_URL+'/?login=1';return} document.getElementById('accAvatar').src=user.pic||user.picture||('https://ui-avatars.com/api/?name='+encodeURIComponent(user.name));document.getElementById('accName').value=user.name||'';document.getElementById('accEmail').value=user.email||'';const ads=getFromDevice('ads',[]);document.getElementById('statAds').textContent=Array.isArray(ads)?ads.length:0;document.getElementById('statImages').textContent=getFromDevice('imageCredits',0);const today=new Date().toISOString().slice(0,10);const q=getFromDevice('quota_'+today,0);document.getElementById('statQuota').textContent=10-(typeof q==='number'?q:parseInt(q||'0'));const login2=getFromDevice('login',null);if(login2&&login2.lastLogin)document.getElementById('statDate').textContent=new Date(login2.lastLogin).toLocaleDateString('ar');}
document.getElementById('accPic').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{document.getElementById('accAvatar').src=rd.result};rd.readAsDataURL(f)});
async function saveProfile(){const name=document.getElementById('accName').value.trim();if(!name){alert('اكتب اسمك');return}const pic=document.getElementById('accAvatar').src;user.name=name;user.pic=pic;user.picture=pic;saveToDevice('profile',{name,email:user.email,pic,phone:user.phone||'',shopName:user.shopName||''});saveToDevice('login',{token,email:user.email,name,pic,lastLogin:Date.now()});try{await fetch(API_BASE+'/api/me/update',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({name,pic})})}catch(e){}alert('تم حفظ التعديل ✅');}
function goMyAds(){location.href=SITE_URL+'/?myads=1'}
function logout(){localStorage.removeItem('sellora_token');location.href=SITE_URL+'/';}
init();
</script>
</body>
                                                                                                                                                                   </html>
